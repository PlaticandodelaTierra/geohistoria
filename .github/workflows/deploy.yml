name: Publicar en GitHub Pages

# En cada push a main: instala, corre las pruebas, compila y publica dist/ en GitHub Pages.
# Si una prueba falla, no se publica. También se puede correr a mano desde la pestaña Actions.
# La ruta del sitio sale del nombre del repositorio (https://<usuario>.github.io/<repo>/), así
# que un cambio de nombre no requiere tocar vite.config.js.
# La prueba masiva del generador (npm run test:masiva) tarda minutos y no se corre aquí.
#
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, la que está en curso termina primero
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicacion
        uses: actions/deploy-pages@v5
